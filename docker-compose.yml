services:
  postgres:
    image: postgres:17-alpine
    container_name: fastapi_postgres
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/mydatabase
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mynetwork
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"

  frontend:
    build:
      context: ./frontend/react-app
      dockerfile: Dockerfile
    container_name: react_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - mynetwork
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  mynetwork:
    driver: bridge

volumes:
  postgres_data:
    driver: local